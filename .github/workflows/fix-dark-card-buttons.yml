name: Fix dark card buttons

on:
  push:
    paths:
      - '.github/workflows/fix-dark-card-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          rule = '.dark .btn{color:var(--ink)!important;background:#fff!important}.dark .btn.primary{color:#fff!important;background:var(--rust)!important}'
          if rule not in s:
              s = s.replace('</style>', rule + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix dark card button text contrast"
          git push
