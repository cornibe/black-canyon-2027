name: Update hero tagline

on:
  push:
    paths:
      - '.github/workflows/update-tagline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tagline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>Race hard.<br>Travel light.</h1>'
          new = '<h1>Race day for one.<br>Adventure for everyone.</h1>'
          if old not in s and new not in s:
              raise RuntimeError('Hero tagline not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change hero tagline to family adventure message"
          git push
